<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaafEntertain — West Coast Guide</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #de3831 0%, #cc2f29 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { max-width: 600px; background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 40px; text-align: center; }
    h1 { color: #de3831; margin-bottom: 10px; font-size: 32px; }
    p { color: #555; margin-bottom: 20px; line-height: 1.6; }
    .cta { background: #de3831; color: white; padding: 14px 32px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 20px; }
    .cta:hover { background: #cc2f29; }
    .features { text-align: left; margin: 30px 0; }
    .features li { margin: 10px 0; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ LaafEntertain</h1>
    <p>Your local entertainment & lifestyle guide for the West Coast</p>
    <p>Events • Venues • Dining • Activities</p>
    <ul class="features">
      <li>🎭 Live music & theatre</li>
      <li>🍽️ Best restaurants & bars</li>
      <li>🏖️ Outdoor activities</li>
      <li>📅 Weekly events calendar</li>
    </ul>
    <a href="#coming-soon" class="cta">Coming Soon</a>
    <p style="margin-top: 30px; font-size: 14px; color: #999;">Launching Q3 2026 | Langebaan, Western Cape</p>
  </div>
</body>
</html>
